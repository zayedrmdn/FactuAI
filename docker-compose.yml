services:
  db:
    image: pgvector/pgvector:pg16
    container_name: factuai-db
    environment:
      POSTGRES_DB: factuai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d factuai" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: factuai-redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  embeddings:
    image: michaelf34/infinity:latest
    container_name: factuai-embeddings
    ports:
      - "7997:7997"
    environment:
      INFINITY_MODEL_ID: BAAI/bge-small-en-v1.5
      INFINITY_BATCH_SIZE: "8"
    command: v2
    volumes:
      - model_cache:/app/.cache
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7997/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  model_cache:


